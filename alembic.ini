# Alembic configuration for EIAMS

[alembic]
# Path to migration scripts
script_location = src/eiams/infrastructure/persistence/migrations

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# Truncate revision IDs in file names
truncate_slug_length = 40

# Database connection string - override via DATABASE_URL env var
sqlalchemy.url = sqlite:///./eiams.db

[post_write_hooks]
# No hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
